<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Penitipan Barang | Vonexus 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    body { font-family: "Plus Jakarta Sans", sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <main class="mx-auto max-w-3xl px-4 py-5 sm:py-10">
    <div class="mb-5 flex items-center gap-3">
      <div class="flex h-12 w-12 items-center justify-center overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
        <img src="assets/vonexus-logo.png" alt="Vonexus 2026" class="h-full w-full object-cover">
      </div>
      <div>
        <h1 class="text-lg font-extrabold text-slate-900 sm:text-xl">Form Penitipan Barang</h1>
        <p class="text-xs text-slate-500">Koordinasi Lapangan &amp; Keamanan Vonexus 2026</p>
      </div>
    </div>

    <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:p-8">
      <form id="participantForm" class="space-y-4">
        <div>
          <label for="participantName" class="mb-1.5 block text-xs font-bold uppercase text-slate-700">Nama peserta *</label>
          <input id="participantName" required class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-[#297810] focus:ring-2 focus:ring-[#297810]/20" placeholder="Nama lengkap">
        </div>

        <div>
          <label for="participantCategory" class="mb-1.5 block text-xs font-bold uppercase text-slate-700">Kategori *</label>
          <select id="participantCategory" required class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-[#297810] focus:ring-2 focus:ring-[#297810]/20">
            <option value="" selected disabled>Pilih kategori...</option>
            <option value="LPIKM">LPIKM</option>
            <option value="BMC">BMC</option>
            <option value="BPC">BPC</option>
            <option value="Essay">Essay</option>
            <option value="Cerdas Cermat">Cerdas Cermat</option>
          </select>
        </div>

        <div class="grid gap-4 sm:grid-cols-2">
          <div>
            <label for="participantPhone" class="mb-1.5 block text-xs font-bold uppercase text-slate-700">WhatsApp</label>
            <input id="participantPhone" type="tel" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-[#297810] focus:ring-2 focus:ring-[#297810]/20" placeholder="081234567890">
          </div>
          <div>
            <label for="participantEmail" class="mb-1.5 block text-xs font-bold uppercase text-slate-700">Email *</label>
            <input id="participantEmail" type="email" required class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-[#297810] focus:ring-2 focus:ring-[#297810]/20" placeholder="peserta@example.com">
          </div>
        </div>

        <div>
          <label for="participantItems" class="mb-1.5 block text-xs font-bold uppercase text-slate-700">Rincian barang *</label>
          <div class="mb-2 flex flex-wrap gap-2" aria-label="Pilihan cepat jenis barang">
            <button type="button" data-item="Tas Ransel" class="quick-item rounded-lg border border-slate-200 bg-slate-100 px-3 py-2 text-xs font-semibold text-slate-700 hover:border-[#b8e2b3] hover:bg-[#eaf7e8] hover:text-[#186301]">
              🎒 Tas Ransel
            </button>
            <button type="button" data-item="Laptop / Tablet" class="quick-item rounded-lg border border-slate-200 bg-slate-100 px-3 py-2 text-xs font-semibold text-slate-700 hover:border-[#b8e2b3] hover:bg-[#eaf7e8] hover:text-[#186301]">
              💻 Laptop / Tablet
            </button>
            <button type="button" data-item="Jaket / Hoodie" class="quick-item rounded-lg border border-slate-200 bg-slate-100 px-3 py-2 text-xs font-semibold text-slate-700 hover:border-[#b8e2b3] hover:bg-[#eaf7e8] hover:text-[#186301]">
              🧥 Jaket / Hoodie
            </button>
            <button type="button" data-item="Payung" class="quick-item rounded-lg border border-slate-200 bg-slate-100 px-3 py-2 text-xs font-semibold text-slate-700 hover:border-[#b8e2b3] hover:bg-[#eaf7e8] hover:text-[#186301]">
              ☂️ Payung
            </button>
            <button type="button" data-item="Helm" class="quick-item rounded-lg border border-slate-200 bg-slate-100 px-3 py-2 text-xs font-semibold text-slate-700 hover:border-[#b8e2b3] hover:bg-[#eaf7e8] hover:text-[#186301]">
              🪖 Helm
            </button>
            <button type="button" data-item="Makanan / Minuman" class="quick-item rounded-lg border border-slate-200 bg-slate-100 px-3 py-2 text-xs font-semibold text-slate-700 hover:border-[#b8e2b3] hover:bg-[#eaf7e8] hover:text-[#186301]">
              🍱 Makanan / Minuman
            </button>
            <button type="button" data-item="Paper Bag / Dus" class="quick-item rounded-lg border border-slate-200 bg-slate-100 px-3 py-2 text-xs font-semibold text-slate-700 hover:border-[#b8e2b3] hover:bg-[#eaf7e8] hover:text-[#186301]">
              🛍️ Paper Bag / Dus
            </button>
          </div>
          <div class="grid gap-3 sm:grid-cols-2">
            <div>
              <label for="participantBrand" class="mb-1.5 block text-[11px] font-bold uppercase text-slate-600">Merk barang</label>
              <input id="participantBrand" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-[#297810] focus:ring-2 focus:ring-[#297810]/20" placeholder="Contoh: Eiger, Samsung">
            </div>
            <div>
              <label for="participantColor" class="mb-1.5 block text-[11px] font-bold uppercase text-slate-600">Warna barang</label>
              <input id="participantColor" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-[#297810] focus:ring-2 focus:ring-[#297810]/20" placeholder="Contoh: Hitam, Biru">
            </div>
          </div>
          <textarea id="participantItems" required rows="3" class="mt-3 w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-[#297810] focus:ring-2 focus:ring-[#297810]/20" placeholder="Rincian tambahan, contoh: Tas ransel besar"></textarea>
        </div>

        <div class="grid gap-4 sm:grid-cols-2">
          <div>
            <label for="participantRack" class="mb-1.5 block text-xs font-bold uppercase text-slate-700">Lokasi rak</label>
            <input id="participantRack" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-[#297810] focus:ring-2 focus:ring-[#297810]/20" placeholder="Diisi panitia jika diperlukan">
          </div>
          <div>
            <label for="participantNotes" class="mb-1.5 block text-xs font-bold uppercase text-slate-700">Catatan</label>
            <input id="participantNotes" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-[#297810] focus:ring-2 focus:ring-[#297810]/20" placeholder="Opsional">
          </div>
        </div>

        <button id="participantSubmit" type="submit" class="flex w-full items-center justify-center gap-2 rounded-xl bg-[#186301] px-4 py-3 text-sm font-bold text-white hover:bg-[#134e01]">
          <i class="fa-solid fa-paper-plane"></i>
          Simpan &amp; Buat Tiket
        </button>
      </form>
    </section>
  </main>

  <div id="participantTicket" class="fixed inset-0 z-50 hidden items-center justify-center overflow-y-auto bg-slate-950/70 p-4">
    <div class="w-full max-w-md rounded-2xl bg-white p-5 shadow-2xl">
      <div class="text-center">
        <p class="text-[10px] font-bold uppercase tracking-widest text-[#49a141]">Koordinasi Lapangan &amp; Keamanan Vonexus 2026</p>
        <h2 class="mt-1 text-lg font-extrabold text-[#186301]">Tiket Penitipan</h2>
      </div>
      <div class="my-4 rounded-xl border-2 border-dashed border-[#b8e2b3] bg-[#f4faf3] py-3 text-center">
        <p class="text-[10px] font-bold text-slate-500">NOMOR TIKET</p>
        <p id="participantTicketCode" class="mt-1 font-mono text-2xl font-black text-[#186301]"></p>
      </div>
      <div id="participantQr" class="flex justify-center"></div>
      <button type="button" onclick="document.getElementById('participantTicket').classList.add('hidden');document.getElementById('participantTicket').classList.remove('flex')" class="mt-4 w-full rounded-xl bg-slate-100 px-4 py-3 text-sm font-bold text-slate-700">
        Selesai
      </button>
    </div>
  </div>

  <script src="supabase-config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="participant.js"></script>
</body>
</html>
